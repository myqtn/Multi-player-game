        }

        #cuBtn { position:fixed; top:64px; right:18px; width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,0.15); background:rgba(0,0,0,0.5); backdrop-filter:blur(8px); font-size:1.3rem; z-index:60; display:none; cursor:pointer; }

const leftInput  = { x:0, y:0 };

function setupJoystick(el, knob, out) {
    const RADIUS = el.offsetWidth / 2 - 12;

    function move(cx, cy) {
        const rect = el.getBoundingClientRect(); // live rect each event
        const dx   = cx - (rect.left + rect.width  / 2);
        const dy   = cy - (rect.top  + rect.height / 2);
        const dist = Math.hypot(dx, dy);
        const clamped = Math.min(dist, RADIUS);
        const angle   = Math.atan2(dy, dx);
        const nx = Math.cos(angle) * (clamped / RADIUS);
        const ny = Math.sin(angle) * (clamped / RADIUS);
        knob.style.transform = `translate(${nx*RADIUS}px,${ny*RADIUS}px)`;
        out.x =  nx;
        out.y = -ny;
    }
    function reset() {
        knob.style.transform = 'translate(0,0)';
        out.x = out.y = 0;
    }

    // Touch (identifier-tracked so a second finger can look around)
    let tid = null;
    el.addEventListener('touchstart', e => { e.preventDefault(); if (tid !== null) return; const t=e.changedTouches[0]; tid=t.identifier; move(t.clientX,t.clientY); }, { passive:false });
    el.addEventListener('touchmove',  e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier===tid) move(t.clientX,t.clientY); }, { passive:false });
    const endT = e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier===tid) { tid=null; reset(); } };
    el.addEventListener('touchend', endT, { passive:false });
    el.addEventListener('touchcancel', endT, { passive:false });

    // Mouse fallback
    let down = false;
    el.addEventListener('mousedown', e => { down=true; move(e.clientX,e.clientY); });
    window.addEventListener('mousemove', e => { if(down) move(e.clientX,e.clientY); });
    window.addEventListener('mouseup',   () => { if(down){ down=false; reset(); } });
}

async function joinGame(rawName) {
    const name = rawName.trim();
    if (!name) { joinError.textContent = 'Please enter a name.'; return; }

    joinError.textContent = '';
    joinBtn.disabled      = true; await gatePerms();
    loadingStatus.textContent = 'Creating your avatar…';
    loadingOverlay.classList.add('active');

    try {
        myId = `p_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;

        const ref = doc(db, 'players', myId);

        // Initial create – must match security rule 'create' allowed fields exactly
        await setDoc(ref, {
            name,
            score:     0,
            x: 0, y: 20, z: 0,
            qx: 0, qy: 0, qz: 0, qw: 1,
            createdAt: serverTimestamp(),
            lastSeen:  serverTimestamp()
        });

        loadingStatus.textContent = 'Entering the dream…';

        // Cleanup on tab close (best-effort)
        window.addEventListener('beforeunload', () => deleteDoc(ref)); window.addEventListener('pagehide', () => deleteDoc(ref));

        // Show game UI
        joinOverlay.classList.add('hidden');
        hud.style.display = 'flex'; document.getElementById('cuBtn').style.display='block'; document.getElementById('qb').style.display='flex';
        document.querySelectorAll('.joystick').forEach(el => el.style.opacity = '1');

        playerGroup.position.set(0, 1.7, 30); hY = 0;
        playerGroup.visible = false;
        euler.set(0, 0, 0);
        playerGroup.quaternion.setFromEuler(euler);

        loadWallet(name);
        startSync(ref);
        isJoined = true;
        loadingOverlay.classList.remove('active');

    } catch (err) {
        console.error('Join error:', err);
        loadingOverlay.classList.remove('active');
        joinBtn.disabled = false;
        joinError.textContent = `❌ ${err.message || 'Failed to connect. Check console (F12).'}`;
        myId = null;
    }
}

                x: p.x, y: p.y, z: p.z,
                qx: q.x, qy: q.y, qz: q.z, qw: q.w,
                lastSeen: serverTimestamp()
            });
        } catch (e) {
            // Non-fatal – log only in dev
            console.warn('pos update:', e.code, e.message);
        }
    }, 120);

    // Live player list
    let lastSnap=null;const staleDel=new Set();
    const procSnap = snap => {
        let ref=0;snap.forEach(d=>{const l=d.data({serverTimestamps:'estimate'}).lastSeen;if(l&&l.toMillis)ref=Math.max(ref,l.toMillis())});
        const seen = new Set();
        let total = 0;
        let nearby = 0;

        snap.forEach(docSnap => {
            const id   = docSnap.id;
            const data = docSnap.data({serverTimestamps:'estimate'});
            if (id === myId) return;
            if (data.x == null) return;
            const ls=data.lastSeen&&data.lastSeen.toMillis?data.lastSeen.toMillis():ref;
            if(ref-ls>20000){if(ref-ls>60000&&!staleDel.has(id)){staleDel.add(id);deleteDoc(docSnap.ref).catch(()=>{})}return}

            total++;
            seen.add(id);

            // Upsert remote avatar
            if (!remotePlayers.has(id)) {
                const group = new THREE.Group();
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(1, 16, 16),
                    new THREE.MeshStandardMaterial({ color:0x60a5fa, emissive:0x3b82f6, emissiveIntensity:0.2, roughness:0.3 })
                );
                sphere.castShadow = true;
                group.add(sphere);
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(1.4, 0.06, 8, 20),
                    new THREE.MeshStandardMaterial({ color:0xa78bfa, emissive:0x7c3aed, emissiveIntensity:0.3, transparent:true, opacity:0.55 })
                );
                ring.rotation.x = Math.PI / 2;
                group.add(ring);
                scene.add(group);
                remotePlayers.set(id, { group });
            }

            const rp = remotePlayers.get(id);
            rp.group.position.set(data.x, data.y - 0.7, data.z);
            if (data.qx != null) rp.group.quaternion.set(data.qx, data.qy, data.qz, data.qw);
            if (typeof data.av === 'string') {
                const av = parseAv(data.av);
                if (CH[av.c]) {
                    if (rp.k !== av.k) { if (rp.ch) scene.remove(rp.ch); rp.o = buildChar(av.c, av.q, av.pt); rp.ch = rp.o.g; rp.k = av.k; scene.add(rp.ch); rp.group.visible = false; }
                    if (rp.n !== undefined && rp.n !== av.n && ACTS[av.a]) rp.cur = { A: ACTS[av.a], t0: performance.now() };
                    rp.n = av.n;
                    const mv = Math.hypot(data.x - (rp.px ?? data.x), data.z - (rp.pz ?? data.z)); rp.px = data.x; rp.pz = data.z; rp.sw = Math.max(rp.sw || 0, Math.min(1, mv * 1.6));
                    rp.by = data.y - 1.7; rp.ry = new THREE.Euler().setFromQuaternion(rp.group.quaternion, 'YXZ').y;
                    rp.ch.position.set(data.x, rp.by + rp.o.sh, data.z); rp.ch.rotation.y = rp.ry;
                }
            }

            const dist = playerGroup.position.distanceTo(rp.group.position);
            if (dist < 40) nearby++;
        });

        // Remove stale players
        for (const [id, rp] of remotePlayers) {
            if (!seen.has(id)) {
                scene.remove(rp.group); if (rp.ch) scene.remove(rp.ch);
                remotePlayers.delete(id);
            }
        }

        playerCountEl.textContent = total;
        nearbyCountEl.textContent = nearby;
    };
    firestoreUnsub = onSnapshot(collection(db, 'players'), sn => { lastSnap = sn; procSnap(sn); }, err => { console.error('Firestore snapshot error:', err); });
    setInterval(() => { if (lastSnap) procSnap(lastSnap); }, 5000);
}

// ── ANIMATION LOOP ───────────────────────────────────────────────
let camCd=4.5;
function animate() {
    requestAnimationFrame(animate);
    worldTick(); remoteAnim();

    if (isJoined) {
        // Walking: left stick moves along the ground, collides with walls
        const yaw = euler.y;
        const dx = (-Math.sin(yaw) * leftInput.y + Math.cos(yaw) * leftInput.x) * WALK * (boost&&flyOn?2.2:1);
        const dz = (-Math.cos(yaw) * leftInput.y - Math.sin(yaw) * leftInput.x) * WALK * (boost&&flyOn?2.2:1);
        velocity.x += (dx - velocity.x) * 0.2;
        velocity.z += (dz - velocity.z) * 0.2;
        velocity.y  = 0;
        const px = playerGroup.position.x + velocity.x, pz = playerGroup.position.z + velocity.z;
        if(!cling&&canCling()&&(hit(px,playerGroup.position.z)||hit(playerGroup.position.x,pz)))tryCling(px,pz);
        if(!cling){
        if (!hit(px, playerGroup.position.z)) playerGroup.position.x = px;
        if (!hit(playerGroup.position.x, pz)) playerGroup.position.z = pz;}
        // Players are solid: push out of any nearby player at a similar height
        if(!cling){const P=playerGroup.position;for(const rp of remotePlayers.values()){if(!rp.o||rp.by===undefined||Math.abs(hY-rp.by)>1.7)continue;const rx=rp.group.position.x,rz=rp.group.position.z,m=.85;let ox=P.x-rx,oz=P.z-rz,d=Math.hypot(ox,oz);if(d<m){if(d<.001){ox=Math.sin(yaw);oz=Math.cos(yaw);d=1}const nx=P.x+ox/d*(m-d),nz=P.z+oz/d*(m-d);if(!hit(nx,P.z))P.x=nx;if(!hit(P.x,nz))P.z=nz;velocity.x*=.5;velocity.z*=.5}}}
        const q=playerGroup.position;let on=0;
        for(const r of RP)if(q.x>r.x0&&q.x<r.x1&&q.z>r.z0&&q.z<r.z1){const y=r.y0+(r.y1-r.y0)*cl((q.z-r.ta)/(r.tb-r.ta),0,1);if(Math.abs(y-hY)<1.1){hY=y;on=1;break}}
        if(cling){clingTick(q);on=1}else if(perch){perchTick(q);on=1}else if(flyTick(q))on=1;if(!on){const n=Math.round((hY-GH)/4),L2=n<0?(hY<2.5?0:GH):GH+4*n;if(Math.abs(hY-L2)<1.3)hY+=(L2-hY)*.25}
        q.y=hY+1.7;

        // Look is drag-based (see DRAG TO LOOK)
        euler.x  = Math.max(-Math.PI/3, Math.min(Math.PI/3, euler.x));
        playerGroup.quaternion.setFromEuler(euler);

        // Camera follows player
        // Player model: body faces walking direction, head follows camera, limbs swing & bend
        const sp=cling?Math.min(1,Math.hypot(leftInput.x,leftInput.y)):Math.min(1,Math.hypot(velocity.x,velocity.z)/WALK),df=angd(euler.y,bodyY);
        walkPh+=sp*0.28;
        if(cling)bodyY=Math.atan2(cling.nx,cling.nz);else if(sp>.08)bodyY+=angd(Math.atan2(-velocity.x,-velocity.z),bodyY)*.2;else if(Math.abs(df)>1.2)bodyY+=df-Math.sign(df)*1.2;
        char.visible=true;char.position.set(q.x,hY,q.z);char.rotation.y=bodyY;
        head.rotation.y=Math.max(-1.2,Math.min(1.2,angd(euler.y,bodyY)));head.rotation.x=euler.x;
        for(let i=0;i<2;i++){const f=walkPh+i*Math.PI;
            legs[i].hip.rotation.x=Math.sin(f)*.9*sp;legs[i].knee.rotation.x=-Math.max(0,Math.cos(f))*sp;
            arms[i].sh.rotation.x=-Math.sin(f)*.8*sp;}actTick(sp,q);crTick(mineO,walkPh,sp);if(cling)char.rotation.x=Math.PI/2;
        // Third-person camera behind the player (stops at walls)
        const pe=Math.max(-.9,Math.min(.5,euler.x)),cx=Math.cos(pe),fx=-Math.sin(euler.y)*cx,fy=Math.sin(pe),fz=-Math.cos(euler.y)*cx,ty=hY+1.5;
        let cdT=4.5;for(let t=.5;t<=4.5;t+=.4)if(hit(q.x-fx*t,q.z-fz*t)){cdT=Math.max(2.8,t-.2);break}
        camCd+=(cdT-camCd)*(cdT<camCd?.4:.06);let cd=camCd;
        let cy=ty-fy*cd;const inside=B.some(b=>b.x0!==undefined&&ib(b,0));
        if(inside)cy=Math.min(cy,hY+(hY<1?4.2:3.4));
        camera.position.set(q.x-fx*cd,Math.max(cy,hY+.6),q.z-fz*cd);
        camera.quaternion.copy(playerGroup.quaternion);

        // Gentle ring spin
        myRing.rotation.z += 0.006;
    }

    renderer.render(scene, camera);
}
chunks(1e9);
